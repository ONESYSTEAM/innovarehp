    <script>
        document.addEventListener("DOMContentLoaded", function () {
            window.addEventListener('scroll', function () {
                const logo = document.getElementById("logo-custom");
                const siteHero = document.querySelector('.site-hero-custom');
                const scrollY = window.scrollY;
                const maxScroll = 300;
                const clampedScroll = Math.min(scrollY, maxScroll);
                const topPercent = 50 - (clampedScroll / maxScroll) * 45;

                if (scrollY > 100) {
                    siteHero.classList.add('bg-visible');
                } else {
                    siteHero.classList.remove('bg-visible');
                }
            });
        });
